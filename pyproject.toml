[project]
name = "fairplay"
version = "0.1.0"
description = "Ranks Lichess accounts by likelihood of a moderator flag, for a fixed-capacity review queue."
requires-python = ">=3.11,<3.12"
# Runtime dependencies are added one part at a time, each with a reason in DECISIONS.md.
dependencies = [
    "chess>=1.11.2",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "uvicorn>=0.54.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "matplotlib>=3.9",
]
research = [
    "catboost>=1.2.10",
    "maia2>=0.9",
    "tabpfn>=9.2.0",
    "torch>=2.15.0",
    "xgboost>=3.2.0",
]
space = [
    "gradio>=6.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
